name: PowerShell quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache pinned PowerShell quality modules
        uses: actions/cache@v4
        with:
          path: |
            ~\Documents\PowerShell\Modules\Pester\5.7.1
            ~\Documents\PowerShell\Modules\PSScriptAnalyzer\1.25.0
          key: ${{ runner.os }}-pwsh7-pester-5.7.1-pssa-1.25.0

      - name: Install pinned quality tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module Pester -ListAvailable | Where-Object Version -eq ([version]'5.7.1'))) {
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          if (-not (Get-Module PSScriptAnalyzer -ListAvailable | Where-Object Version -eq ([version]'1.25.0'))) {
              Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          }
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop

      - name: Parse tracked PowerShell scripts
        shell: pwsh
        run: |
          $failures = foreach ($file in @(git ls-files -- '*.ps1')) {
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                  (Join-Path $PWD $file),
                  [ref]$tokens,
                  [ref]$errors
              )
              foreach ($parseError in @($errors)) {
                  '{0}:{1}:{2}: {3}' -f $file,
                      $parseError.Extent.StartLineNumber,
                      $parseError.Extent.StartColumnNumber,
                      $parseError.Message
              }
          }
          if ($failures) {
              $failures | Write-Error
              throw "PowerShell parsing failed with $(@($failures).Count) error(s)."
          }

      - name: Run Pester 5 tests
        shell: pwsh
        run: |
          ./tools/Invoke-ParallelPester.ps1 -ResultPath "$env:RUNNER_TEMP\boot-upd-pester-results.json"
          $result = Get-Content -LiteralPath "$env:RUNNER_TEMP\boot-upd-pester-results.json" -Raw | ConvertFrom-Json
          "### Pester gate`n``````json`n$(Get-Content -LiteralPath "$env:RUNNER_TEMP\boot-upd-pester-results.json" -Raw)`n``````" >> $env:GITHUB_STEP_SUMMARY

      - name: Run PSScriptAnalyzer error rules
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          if ($findings) {
              $findings | Format-Table -AutoSize | Out-String | Write-Error
              throw "PSScriptAnalyzer reported $($findings.Count) error-severity finding(s)."
          }

      - name: Check diff integrity and clean worktree
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:PR_BASE_SHA) {
              git diff --check "$env:PR_BASE_SHA...$env:GITHUB_SHA"
          } elseif ($env:PUSH_BEFORE_SHA -and $env:PUSH_BEFORE_SHA -notmatch '^0+$') {
              git diff --check "$env:PUSH_BEFORE_SHA..$env:GITHUB_SHA"
          } else {
              git show --check --format=oneline $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Git diff integrity check failed.' }

          $changes = @(git status --porcelain)
          if ($changes) {
              $changes | Write-Error
              throw 'Quality checks modified the worktree.'
          }

  cross-context-mutex:
    name: User/SYSTEM exclusion gate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Exercise production mutex across security contexts
        shell: pwsh
        run: |
          $result = ./tests/integration/Invoke-CrossContextMutexGate.ps1 | Tee-Object -Variable transcript
          $result
          "### User/SYSTEM exclusion gate`n``````json`n$($transcript -join "`n")`n``````" >> $env:GITHUB_STEP_SUMMARY

  published-launcher-upgrade:
    name: Published launcher upgrade gate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Upgrade the immutable v2.5.43 launcher to this candidate
        shell: pwsh
        run: |
          $result = ./tests/integration/Invoke-PublishedLauncherUpgradeGate.ps1 -FromTag v2.5.43 |
              Tee-Object -Variable transcript
          $result
          "### Published launcher upgrade gate`n``````json`n$($transcript -join "`n")`n``````" >> $env:GITHUB_STEP_SUMMARY
